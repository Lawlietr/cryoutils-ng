name: Main

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  release_name: 2.0-${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.26.x'
          check-latest: true
          cache: true

      - name: Install Go Packages
        run: go mod tidy

      - name: Build
        run: GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o cryoutils-ng ./cmd/cryoutils-ng

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.release_name }}
          path: cryoutils-ng

  main-release:
    needs: build
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        id: download
        with:
          name: ${{ env.release_name }}

      - name: Install Hub Package
        run: sudo apt-get install -y hub

      - name: Generate Checksum
        run: md5sum cryoutils-ng > cu.md5

      - name: Delete Previous Latest Release
        uses: dev-drprasad/delete-tag-and-release@v0.2.1
        with:
          tag_name: latest
          delete_release: true
          repo: ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Unique Release
        shell: bash
        run: hub release create ${{ env.release_name }} -m ${{ env.release_name }} -a cryoutils-ng -a cu.md5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Latest Release
        shell: bash
        run: hub release create latest -m latest -a cryoutils-ng -a cu.md5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dev-release:
    needs: build
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        id: download
        with:
          name: ${{ env.release_name }}

      - name: Install Hub Package
        run: sudo apt-get install -y hub

      - name: Delete Previous Develop Release
        uses: dev-drprasad/delete-tag-and-release@v0.2.1
        with:
          tag_name: develop
          delete_release: true
          repo: ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Develop Release
        shell: bash
        run: hub release create develop -m develop -a cryoutils-ng
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
