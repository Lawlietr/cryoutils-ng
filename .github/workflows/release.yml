name: Main

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  release_name: 2.0-${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.26.x'
          check-latest: true
          cache: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Go Packages
        run: go mod tidy

      - name: Build Web UI
        run: cd web && npm ci && npm run build

      - name: Copy Web Build into Desktop Embed
        run: |
          rm -rf cmd/desktop/web/dist
          cp -r web/dist cmd/desktop/web/dist

      - name: Build CLI
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o cryoutils-ng ./cmd/cryoutilities

      - name: Build Desktop Server
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o cryoutils-ng-desktop ./cmd/desktop

      - name: Generate Checksums
        run: |
          md5sum cryoutils-ng > cryoutils-ng.md5
          md5sum cryoutils-ng-desktop > cryoutils-ng-desktop.md5

      - name: Upload CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.release_name }}-cli
          path: cryoutils-ng

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.release_name }}-desktop
          path: cryoutils-ng-desktop

      - name: Upload Checksums
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.release_name }}-checksums
          path: |
            cryoutils-ng.md5
            cryoutils-ng-desktop.md5

  main-release:
    needs: build
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CLI Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.release_name }}-cli

      - name: Download Desktop Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.release_name }}-desktop

      - name: Download Checksums
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.release_name }}-checksums
          path: .

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ env.release_name }} \
            --title ${{ env.release_name }} \
            --notes "Build ${{ env.release_name }}" \
            cryoutils-ng \
            cryoutils-ng.md5 \
            cryoutils-ng-desktop \
            cryoutils-ng-desktop.md5

      - name: Update Latest Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes || true
          gh release create latest \
            --title latest \
            --notes "Latest build" \
            cryoutils-ng \
            cryoutils-ng.md5 \
            cryoutils-ng-desktop \
            cryoutils-ng-desktop.md5

  dev-release:
    needs: build
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CLI Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.release_name }}-cli

      - name: Download Desktop Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.release_name }}-desktop

      - name: Download Checksums
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.release_name }}-checksums
          path: .

      - name: Create Develop Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete develop --yes || true
          gh release create develop \
            --title develop \
            --notes "Develop build ${{ env.release_name }}" \
            cryoutils-ng \
            cryoutils-ng.md5 \
            cryoutils-ng-desktop \
            cryoutils-ng-desktop.md5
